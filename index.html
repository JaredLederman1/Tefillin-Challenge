<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Ratzon. Coming soon.">
  <title>Ratzon</title>
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; background: #000; color: #2478ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; }
    main { padding: 48px 24px; text-align: center; }
    img { display: block; width: clamp(144px, 25vw, 200px); height: auto; margin: 0 auto 28px; }
    h1 { font-size: clamp(48px, 9vw, 64px); line-height: 1.05; font-weight: 700; letter-spacing: -.055em; margin: 0; }
    p { color: #a1a1aa; font-size: 16px; line-height: 1.5; margin: 24px 0 0; }
  </style>
</head>
<body>
  <main>
    <img src="./logo.svg" alt="" width="200" height="200">
    <h1>Ratzon</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
